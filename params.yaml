# Data ingestion
urls_path: data/urls/database_urls.txt

# Chunking
chunk_max_tokens: 350
chunk_merge_peers: True

# Embeddings
dense_embedding_model: "BAAI/bge-base-en-v1.5"
dense_embd_dim: 768
sparse_embedding_model: "Qdrant/bm25"
normalize_embeddings: True

# Vector store
collection_name: 'simple-wikipedia'
persist_directory: data/embeddings

# Retrieval & reranking
rerank_model: 'cross-encoder/ms-marco-MiniLM-L-6-v2'
retrieval_k: 20                    # hybrid retrieve top-k, then rerank down to top_n
rerank_score_threshold: 0.0       # keep only reranker scores strictly above this
top_n: 5

# Chat / answer generation
chat_model: 'gemma4:31b'
chat_temperature: 0.0

# Synthetic golden-set generation
synthesizer_model: 'qwen3.8:27b'
synthesizer_temperature: 0.7

# Weights & Biases — one parent project for all runs, shared group per logical
# experiment. Both values can be overridden by the WANDB_PROJECT / WANDB_GROUP
# env vars (which take precedence). Set WANDB_GROUP per run to keep related
# pipeline stages together under one cluster in the W&B UI.
wandb_project: 'hybrid-rag'
wandb_group: 'hyperparameter-tuning'