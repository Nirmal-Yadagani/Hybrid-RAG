stages:
  # ==========================================
  # SHARED DATA INGESTION & RETRIEVAL PIPELINE
  # ==========================================
  dataset:
    cmd: .venv/bin/python src/create_dataset.py
    deps:
      - data/urls/database_urls.txt
      - src/create_dataset.py
    params:
      - params.yaml:
          - urls_path
    outs:
      - data/raw/ai_ml_raw_html.json

  chunk:
    cmd: .venv/bin/python src/create_chunks.py
    deps:
      - data/raw/ai_ml_raw_html.json
      - src/create_chunks.py
    params:
      - params.yaml:
          - chunk_max_tokens
          - chunk_merge_peers
          - dense_embedding_model
    outs:
      - data/processed/ai_ml_rag_chunks.json

  embed:
    cmd: .venv/bin/python src/create_embeddings.py
    deps:
      - data/processed/ai_ml_rag_chunks.json
      - src/create_embeddings.py
    params:
      - params.yaml:
          - dense_embedding_model
          - dense_embd_dim
          - sparse_embedding_model
          - normalize_embeddings
          - collection_name
          - persist_directory
    outs:
      - data/embeddings_status.json

  # ==========================================
  # BRANCH A: SYNTHETIC BASELINE PIPELINE
  # ==========================================
  generate:
    cmd: .venv/bin/python src/generate_baseline.py
    deps:
      - data/embeddings_status.json
      - src/generate_baseline.py
    params:
      - params.yaml:
          - synthesizer_model
          - synthesizer_temperature
          - persist_directory
          - collection_name
          - quality_threshold
          - max_quality_retries
          - min_golden_quality_to_keep
          - num_evolutions
    outs:
      - data/eval/goldens_100_raw.json

  validate_goldens:
    cmd: .venv/bin/python src/validate_goldens.py
    deps:
      - data/eval/goldens_100_raw.json
      - src/validate_goldens.py
    params:
      - params.yaml:
          - validator_model
          - validator_temperature
    outs:
      - data/eval/goldens_clean.json

  eval_synthetic:
    cmd: .venv/bin/python src/run_evals.py --input data/eval/goldens_clean.json --output data/eval/raw_evaluations_synthetic.json --cache data/eval/cache_synthetic.json
    deps:
      - data/eval/goldens_clean.json
      - data/embeddings_status.json
      - src/run_evals.py
    params:
      - params.yaml:
          - chat_model
          - chat_temperature
          - top_n
          - retrieval_k
          - rerank_score_threshold
          - rerank_model
    outs:
      - data/eval/raw_evaluations_synthetic.json
      - data/eval/cache_synthetic.json

  export_synthetic:
    cmd: .venv/bin/python src/export_results.py --input data/eval/raw_evaluations_synthetic.json --output data/eval/evaluation_results_synthetic.json --run_name "synthetic-tuning-v1"
    deps:
      - data/eval/raw_evaluations_synthetic.json
      - src/export_results.py
    params:
      - params.yaml:
          - top_n
          - chunk_max_tokens
    outs:
      - data/eval/evaluation_results_synthetic.json

  # ==========================================
  # BRANCH B: MANUAL MULTI-CHUNK PIPELINE
  # ==========================================
  eval_manual:
    cmd: .venv/bin/python src/run_evals.py --input data/eval/manual_eval.json --output data/eval/raw_evaluations_manual.json --cache data/eval/cache_manual.json
    deps:
      - data/eval/manual_eval.json
      - data/embeddings_status.json
      - src/run_evals.py
    params:
      - params.yaml:
          - chat_model
          - chat_temperature
          - top_n
          - retrieval_k
          - rerank_score_threshold
          - rerank_model
    outs:
      - data/eval/raw_evaluations_manual.json
      - data/eval/cache_manual.json

  export_manual:
    cmd: .venv/bin/python src/export_results.py --input data/eval/raw_evaluations_manual.json --output data/eval/evaluation_results_manual.json --run_name "manual-tuning-v1"
    deps:
      - data/eval/raw_evaluations_manual.json
      - src/export_results.py
    params:
      - params.yaml:
          - top_n
          - chunk_max_tokens
    outs:
      - data/eval/evaluation_results_manual.json