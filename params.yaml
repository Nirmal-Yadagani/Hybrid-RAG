# Data ingestion
urls_path: data/urls/database_urls.txt

# Chunking
chunk_max_tokens: 250
chunk_merge_peers: true

# Embeddings
dense_embedding_model: BAAI/bge-base-en-v1.5
dense_embd_dim: 768
sparse_embedding_model: Qdrant/bm25
normalize_embeddings: true

# Vector store
collection_name: simple-wikipedia
persist_directory: data/embeddings

# Retrieval & reranking
rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2
retrieval_k: 50                    # hybrid retrieve top-k, then rerank down to top_n
rerank_score_threshold: 0.5       # only real lever — tighter helps synth, looser helps manual; 0.5 is mid
top_n: 3

# Chat / answer generation
chat_model: gemma4:31b
chat_temperature: 0.0

# Synthetic golden-set generation
synthesizer_model: qwen3.8:27b
synthesizer_temperature: 0.7

# Golden quality controls (single-chunk-baseline tier)
quality_threshold: 0.6             # retry target for synthetic_input_quality_threshold (0-1)
max_quality_retries: 3             # retries before keeping the best-effort golden regardless of score
min_golden_quality_to_keep: 0.5    # hard floor — goldens still below this after retries are dropped
num_evolutions: 1                  # evolution passes per question (DeepEval default is 1)

# Validation / LLM-as-a-judge
validator_model: gemma4:31b
validator_temperature: 0.0

# Weights & Biases — one parent project for all runs, shared group per logical
# experiment. Both values can be overridden by the WANDB_PROJECT / WANDB_GROUP
# env vars (which take precedence). Set WANDB_GROUP per run to keep related
# pipeline stages together under one cluster in the W&B UI.
wandb_project: rag-optimization
wandb_group: hyperparameter-tuning
